<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="application-name" content="Centfolio" />
    <meta name="apple-mobile-web-app-title" content="Centfolio" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Split expenses fairly with friends and groups. Track balances, simplify debts, and settle up effortlessly with Centfolio." />
    <title>Centfolio — Smart Expense Splitting</title>

    <script>
      // Early capture of Chromium beforeinstallprompt before React mounts
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
      });
    </script>

    <!-- Google Fonts Preconnect & Stylesheet (Non-blocking CRP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var scheme = localStorage.getItem('centfolio_scheme') || localStorage.getItem('splitwisely_scheme');
        if (!scheme) {
          scheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-scheme', scheme);
        var theme = localStorage.getItem('centfolio_theme') || localStorage.getItem('splitwisely_theme');
        if (theme && theme !== 'green') {
          document.documentElement.setAttribute('data-theme', theme);
        }
        var statusBarColor = scheme === 'dark' ? '#0f131a' : '#ffffff';
        var metaTags = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metaTags.length; i++) {
          metaTags[i].setAttribute('content', statusBarColor);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
